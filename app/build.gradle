plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.velocity.browser'
    compileSdk 36

    defaultConfig {
        applicationId "com.velocity.browser"
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName "3.0"
        
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        release {
            def localProps = new Properties()
            def localPropsFile = rootProject.file('local.properties')
            if (localPropsFile.exists()) {
                localProps.load(new FileInputStream(localPropsFile))
            }
            def storePath = localProps.getProperty('signing.storeFile') ?: 'release.jks'
            storeFile rootProject.file(storePath)
            storePassword localProps.getProperty('signing.storePassword') ?: '8097242441'
            keyAlias localProps.getProperty('signing.keyAlias') ?: 'upload'
            keyPassword localProps.getProperty('signing.keyPassword') ?: '8097242441'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation "app.cash.quickjs:quickjs-android:0.9.2"
    implementation "org.jsoup:jsoup:1.15.4"

    // Markwon Android Markdown Library (No WebView)
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tasklist:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"
    implementation "io.noties.markwon:image:4.6.2"

    // AndroidSVG for Vector / SVG image decoding and rendering
    implementation "com.caverock:androidsvg-aar:1.4"
}